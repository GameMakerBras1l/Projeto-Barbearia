
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Barbearia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #202020;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
        }

        h1 {
            color: #222;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #222;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>

    <div class="login">
        <h1>Barbearia</h1>
        <h2>Login</h2>

        <form action="index.html">
            <input type="text"
                   placeholder="Usuário"
                   required>

            <input type="password"
                   placeholder="Senha"
                   required>

            <button type="submit">Entrar</button>
        </form>
    </div>

</body>
</html>
